name: Build, Test & Pack

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore WaevaRpc.sln

      - name: Build
        run: dotnet build WaevaRpc.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WaevaRpcTests/WaevaTests.csproj --configuration Release --no-build --verbosity normal

      - name: Check formatting
        run: dotnet format WaevaRpc.sln --verify-no-changes --severity warn

      - name: Check vulnerable packages
        run: dotnet list WaevaRpc.sln package --vulnerable

  pack:
    runs-on: ubuntu-latest
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore WaevaRpc.sln

      - name: Pack NuGet packages
        run: |
          dotnet pack WaevaRpcCommon/WaevaCommon.csproj --configuration Release -p:PackageVersion=${{ github.ref_name }}
          dotnet pack WaevaRpcCore/WaevaCore.csproj --configuration Release -p:PackageVersion=${{ github.ref_name }}
          dotnet pack WaevaRpcHub/WaevaHub.csproj --configuration Release -p:PackageVersion=${{ github.ref_name }}
          dotnet pack WaevaRpcRest/WaevaRest.csproj --configuration Release -p:PackageVersion=${{ github.ref_name }}
          dotnet pack WaevaRpcWebSocket/WaevaWebSocket.csproj --configuration Release -p:PackageVersion=${{ github.ref_name }}
          dotnet pack WaevaRpcClient/WaevaClient.csproj --configuration Release -p:PackageVersion=${{ github.ref_name }}
          dotnet pack WaevaRpcDeveloperUi/WaevaDeveloperUi.csproj --configuration Release -p:PackageVersion=${{ github.ref_name }}

      - name: Publish to NuGet
        run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish symbol packages
        run: dotnet nuget push "**/*.snupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            **/*.nupkg
            **/*.snupkg